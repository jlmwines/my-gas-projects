<style>
  /* Publishing Board (PUBLISHING_BOARD_PLAN.md): one row per calendar row, tasks as chips. */
  .pb-row {
    display: grid;
    /* Little usually sits between Translate and the end point, so that lane is narrow. */
    grid-template-columns: 170px minmax(0, 3fr) 130px minmax(40px, 1fr) 130px;
    gap: 8px;
    align-items: center;
    padding: 6px 4px;
    border-bottom: 1px solid #f1f3f5;
  }
  .pb-head { font-size: 11px; color: #6c757d; text-transform: uppercase; letter-spacing: .03em; border-bottom: 1px solid #dee2e6; }
  .pb-anchor { background: #f8f9fa; border-radius: 4px; min-height: 28px; padding: 2px; }
  .pb-lane { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .pb-pub-date { font-size: 12px; color: #6c757d; }
  .pb-pub-name { font-weight: 600; font-size: 13px; }
  .pb-pub-type { font-size: 11px; color: #6c757d; }
  .pb-redate { cursor: pointer; border-bottom: 1px dashed #adb5bd; }
  .pb-redate:hover { color: #0d6efd; }
  .role-admin .pb-day { cursor: pointer; }
  .pb-docs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 2px; font-size: 11px; }
  .pb-docs .btn { padding: 0 6px; font-size: 11px; line-height: 1.5; }
  .pb-divider { padding: 3px 4px; font-size: 11px; color: #6c757d; background: #fafbfc; border-bottom: 1px solid #f1f3f5; }
  .pb-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; line-height: 1.2; padding: 3px 7px; border-radius: 10px;
    border: 1px solid transparent; white-space: nowrap;
  }
  .pb-chip.pb-click { cursor: pointer; }
  .pb-chip.pb-click:hover { filter: brightness(0.95); }
  .pb-chip.pb-late { border-color: #dc3545; color: #dc3545; font-weight: 600; }
  .pb-chip.pb-undated { background: #f1f3f5; color: #868e96; }
  .pb-chip .pb-who { font-weight: 700; opacity: .75; }
  .pb-row.pb-flash { background: #fff3cd; transition: background 1.5s; }
  /* Month grid */
  .pb-month-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .pb-month-title { font-weight: 600; min-width: 140px; text-align: center; }
  .pb-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid #dee2e6; border-left: 1px solid #dee2e6; }
  .pb-dow { font-size: 11px; color: #6c757d; padding: 2px 4px; border-right: 1px solid #dee2e6; border-bottom: 1px solid #dee2e6; background: #f8f9fa; }
  .pb-day { min-height: 92px; padding: 2px 3px; border-right: 1px solid #dee2e6; border-bottom: 1px solid #dee2e6; overflow: hidden; }
  .pb-day.pb-other { background: #fafbfc; color: #adb5bd; }
  .pb-day.pb-today { box-shadow: inset 0 0 0 2px #0d6efd; }
  .pb-daynum { font-size: 11px; color: #6c757d; }
  .pb-pub { display: block; font-size: 11px; font-weight: 600; padding: 1px 4px; margin: 1px 0; border-radius: 3px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pb-mark { display: block; font-size: 10px; color: #6c757d; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pb-grid .pb-chip { display: flex; margin: 1px 0; padding: 1px 5px; overflow: hidden; }
  .pb-grid .pb-chip .pb-chip-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .pb-grid .pb-chip.pb-done { opacity: .55; }
  .pb-more { font-size: 10px; color: #0d6efd; cursor: pointer; }
  @media (max-width: 768px) {
    .pb-day { min-height: 60px; }
    .pb-grid .pb-chip .pb-chip-text { display: none; }
  }
  @media (max-width: 768px) {
    .pb-row { grid-template-columns: 1fr; gap: 4px; }
    .pb-head { display: none; }
    .pb-anchor { min-height: 0; }
    .pb-anchor:empty { display: none; }
  }
</style>

<script>
  // Publishing Board — rendered by PublishingView into #pv-board-wrap from the
  // data the view already loads (state.holidays = calendar rows, state.tasks +
  // state.archivedTasks). Chip click opens the shared TaskDetail modal, which
  // owns every write (dates, close, pack actions such as Mark Published).
  window.PublishingBoard = (function() {
    'use strict';

    var TRANSLATE_TYPE = 'task.content.translate';
    // Each content row has exactly one end point (plan, "Settled details").
    var END_TYPES = ['task.content.blog_publish', 'task.content.email.send', 'task.content.print.distribute'];
    var DIVIDER_TYPES = ['holiday', 'blackout', 'note'];

    var esc = function(s) { return TaskWidgets.escape(s == null ? '' : String(s)); };

    function _baseSlug(slug) {
      slug = slug || '';
      var tail = slug.slice(-3);
      return (tail === '-en' || tail === '-he') ? slug.slice(0, -3) : slug;
    }

    function _isContentTask(t) {
      return t.typeId && (t.typeId.indexOf('task.content.') === 0 || t.typeId === 'task.newsletter.distribute');
    }

    function _sortKey(t) {
      return TaskWidgets.formatDate(t.startDate || t.dueDate) || '';
    }

    // Task title is `name` in WebAppLibrary_getData's task shape.
    function _title(t) { return t.name || t.title || ''; }

    // Title prefix ("Review Extracts: …" → Review Extracts); falls back to the
    // type id with its namespace stripped (task.content.edit → edit).
    function _label(t) {
      return String(_title(t) || t.typeId || '').split(':')[0]
        .replace(/task\.(content|newsletter)\./g, '').replace(/[._]/g, ' ').trim() || 'Task';
    }

    function _chip(t, openIds) {
      var closed = TaskWidgets.isClosed(t);
      var label = _label(t);
      var lang = (t.entityId || '').slice(-3) === '-he' ? ' HE' : '';
      var who = t.assignedTo === 'Manager' ? 'M' : (t.assignedTo ? 'A' : '');
      var due = TaskWidgets.formatDate(t.dueDate);
      var cls = 'pb-chip';
      var stateText;
      if (closed) {
        cls += ' tw-status-pill done';
        stateText = '&#10003;';
      } else if (!t.startDate && !t.dueDate) {
        cls += ' pb-undated';
        stateText = 'no date';
      } else {
        cls += ' tw-status-pill open';
        if (TaskWidgets.isOverdue(t.dueDate, t.status)) cls += ' pb-late';
        stateText = due ? esc(due.slice(5)) : '';
      }
      var clickable = !!openIds[t.id];
      var attrs = clickable
        ? ' class="' + cls + ' pb-click" onclick="TaskDetail.open(\'' + esc(t.id) + '\')"'
        : ' class="' + cls + '"';
      var tip = esc(_title(t)) + (t.startDate ? ' | start ' + esc(TaskWidgets.formatDate(t.startDate)) : '') +
        (due ? ' | due ' + esc(due) : '') + (t.assignedTo ? ' | ' + esc(t.assignedTo) : '');
      return '<span' + attrs + ' title="' + tip + '">' + esc(label + lang) +
        (who ? ' <span class="pb-who">' + who + '</span>' : '') +
        (stateText ? ' ' + stateText : '') + '</span>';
    }

    // Doc links for a row: one per language slug the row's tasks or library
    // entities carry (EN, HE, or a language-neutral slug). An attached Doc opens;
    // a missing one gets an Attach button (PUBLISHING_BOARD_PLAN phase 4).
    // Also used by the Tasks tab (attach=false: links only), so a Hebrew
    // translate task can open the English source too.
    function _docLinks(base, idx, attach) {
      var libBySlug = idx.libBySlug;
      var slugs = {};
      (idx.tasksByBase[base] || []).forEach(function(t) { if (t.entityId) slugs[t.entityId] = true; });
      (idx.libByBase[base] || []).forEach(function(e) { slugs[e.slug] = true; });
      var rank = function(s) { var x = s.slice(-3); return x === '-en' ? 0 : x === '-he' ? 1 : 2; };
      var list = Object.keys(slugs).sort(function(a, b) { return rank(a) - rank(b); });
      if (!list.length) return '';
      return '<div class="pb-docs">' + list.map(function(slug) {
        var tail = slug.slice(-3);
        var lang = tail === '-en' ? 'EN' : tail === '-he' ? 'HE' : 'Doc';
        var e = libBySlug[slug];
        if (e && e.docUrl) {
          return '<a class="tw-file-link" href="' + esc(e.docUrl) + '" target="_blank" rel="noopener" title="Open ' + esc(slug) + '">&#8599; ' + lang + '</a>';
        }
        if (!attach) return '';
        return '<button type="button" class="btn btn-sm btn-light" title="Attach a Doc to ' + esc(slug) +
          '" onclick="PublishingView.boardAttach(\'' + esc(slug) + '\')">Attach ' + lang + '</button>';
      }).join('') + '</div>';
    }

    // Tasks by base slug — open + archived, content types only.
    function _tasksByBase(state) {
      var byBase = {};
      (state.tasks || []).concat(state.archivedTasks || []).forEach(function(t) {
        if (!_isContentTask(t)) return;
        var base = _baseSlug(t.entityId);
        if (base) (byBase[base] = byBase[base] || []).push(t);
      });
      return byBase;
    }

    // Lookup tables for _docLinks; build once per render, not per row.
    function docIndex(state, tasksByBase) {
      var libBySlug = {}, libByBase = {};
      (state.library || []).forEach(function(e) {
        if (!e.slug) return;
        libBySlug[e.slug] = e;
        var b = _baseSlug(e.slug);
        (libByBase[b] = libByBase[b] || []).push(e);
      });
      return { libBySlug: libBySlug, libByBase: libByBase, tasksByBase: tasksByBase || _tasksByBase(state) };
    }

    // Public: links-only Doc entries for the publication a task belongs to.
    function docLinksForTask(t, idx) {
      return _docLinks(_baseSlug(t.entityId), idx, false);
    }

    function render(state, opts) {
      opts = opts || {};
      var container = document.getElementById('pv-board-wrap');
      if (!container) return;
      var search = (opts.search || '').toLowerCase();
      var showAll = !!opts.showAll;

      var byBase = _tasksByBase(state);
      var isAdmin = document.body.classList.contains('role-admin');
      // Only tasks the TaskDetail modal can load (state.tasks) are clickable.
      var openIds = {};
      (state.tasks || []).forEach(function(t) { openIds[t.id] = true; });

      if (opts.mode === 'month') {
        container.innerHTML = _renderMonth(state, opts, byBase, openIds);
        return;
      }

      var docIdx = docIndex(state, byBase);

      var now = new Date();
      var today = TaskWidgets.formatDate(new Date(now.getFullYear(), now.getMonth(), now.getDate()));

      var rows = (state.holidays || []).slice().sort(function(a, b) {
        return (a.date || '').localeCompare(b.date || '');
      });

      // Range = the Calendar tab's Open view: every calendar row is scheduled
      // content. Future rows all show; past rows show unless done (a past row
      // with no tasks is overdue, not done). "All" shows everything.
      var visible = rows.filter(function(h) {
        if (!opts.showHolidays && h.type === 'holiday') return false;
        if (search) {
          var hay = (String(h.name || '') + ' ' + String(h.slug || '')).toLowerCase();
          if (hay.indexOf(search) === -1) return false;
        }
        if (showAll) return true;
        var d = h.date || '';
        var isDivider = DIVIDER_TYPES.indexOf(h.type) !== -1;
        var tasks = h.slug ? byBase[h.slug] : null;
        if (d < today) {
          if (isDivider) return false;
          return !tasks || TaskWidgets.deriveStatus(tasks) !== 'done';
        }
        return true;
      });

      if (!visible.length) {
        container.innerHTML = '<div class="pv-empty">No calendar rows to show.</div>';
        return;
      }

      var html = '<div class="pb-row pb-head"><div>Publication</div><div>Tasks</div><div></div><div></div><div>End</div></div>';

      visible.forEach(function(h) {
        if (DIVIDER_TYPES.indexOf(h.type) !== -1 || !h.slug) {
          html += '<div class="pb-divider">' + esc(h.date) + ' &middot; ' + esc(h.name) +
            (h.notes ? ' &middot; ' + esc(h.notes) : '') + '</div>';
          return;
        }
        var tasks = (byBase[h.slug] || []).slice();
        // Admin: date opens the schedule form in edit mode (re-date this row).
        var dateHtml = isAdmin
          ? '<span class="pb-redate" title="Change publish date" onclick="PublishingView.openSchedule(\'' + esc(h.slug) + '\')">' + esc(h.date) + '</span>'
          : esc(h.date);
        var left = '<div><div class="pb-pub-date">' + dateHtml + ' <span class="pb-pub-type">' + esc(h.type) + '</span></div>' +
          '<div class="pb-pub-name">' + esc(h.name) + '</div>' +
          _docLinks(h.slug, docIdx, true) + '</div>';

        var rowOpen = '<div class="pb-row" id="pb-row-' + esc(h.slug) + '">';
        if (!tasks.length) {
          html += rowOpen + left +
            '<div class="pb-lane"><button type="button" class="btn btn-sm" data-roles="admin" onclick="PublishingView.boardCreate(\'' +
            esc(h.slug) + '\', \'' + esc(h.type) + '\')">Create</button></div><div></div><div></div><div></div></div>';
          return;
        }

        // Dated chips by start date, undated last.
        tasks.sort(function(a, b) {
          var ka = _sortKey(a), kb = _sortKey(b);
          if (!ka && !kb) return 0;
          if (!ka) return 1;
          if (!kb) return -1;
          return ka.localeCompare(kb);
        });
        var translate = tasks.filter(function(t) { return t.typeId === TRANSLATE_TYPE; });
        var ends = tasks.filter(function(t) { return END_TYPES.indexOf(t.typeId) !== -1; });
        var rest = tasks.filter(function(t) { return t.typeId !== TRANSLATE_TYPE && END_TYPES.indexOf(t.typeId) === -1; });

        // Split the free lanes at the Translate milestone's position.
        var pre = rest, mid = [];
        if (translate.length) {
          var tKey = _sortKey(translate[0]);
          pre = []; mid = [];
          rest.forEach(function(t) {
            var k = _sortKey(t);
            if (k && (!tKey || k <= tKey)) pre.push(t); else mid.push(t);
          });
        }
        var lane = function(list) { return list.map(function(t) { return _chip(t, openIds); }).join(''); };

        html += rowOpen + left +
          '<div class="pb-lane">' + lane(pre) + '</div>' +
          '<div class="pb-lane pb-anchor">' + lane(translate) + '</div>' +
          '<div class="pb-lane">' + lane(mid) + '</div>' +
          '<div class="pb-lane pb-anchor">' + lane(ends) + '</div>' +
          '</div>';
      });

      container.innerHTML = html;
    }

    // ── Month grid (phase 3) ──────────────────────────────────────────
    // Same data: publication dates, holidays/notes, and every content task
    // (admin + manager) on its start date (due date when no start), colored
    // by publication so a chain reads as one thread.
    var PALETTE = ['#e3f2fd', '#fde2e4', '#e2f0d9', '#fff2cc', '#ede7f6', '#d9f2f2', '#fce5cd', '#e8eaf6'];
    var MAX_PER_DAY = 4;

    function _colorFor(base, order) {
      if (!(base in order.map)) order.map[base] = order.next++ % PALETTE.length;
      return PALETTE[order.map[base]];
    }

    function _monthChip(t, openIds, color, pub) {
      var pubName = pub.name || pub.slug || '';
      var closed = TaskWidgets.isClosed(t);
      var label = _label(t);
      var who = t.assignedTo === 'Manager' ? 'M' : (t.assignedTo ? 'A' : '');
      var cls = 'pb-chip' + (closed ? ' pb-done' : '') +
        (!closed && TaskWidgets.isOverdue(t.dueDate, t.status) ? ' pb-late' : '');
      var click = openIds[t.id] ? ' pb-click" onclick="TaskDetail.open(\'' + esc(t.id) + '\')' : '';
      var tip = esc(pubName + ' | ' + _title(t)) +
        (t.dueDate ? ' | due ' + esc(TaskWidgets.formatDate(t.dueDate)) : '') + (t.assignedTo ? ' | ' + esc(t.assignedTo) : '');
      return '<span class="' + cls + click + '" style="background:' + color + ';" title="' + tip + '">' +
        (who ? '<span class="pb-who">' + who + '</span> ' : '') +
        // Content + medium first ("blog FAQ"), then the stage, so two streams
        // of the same piece (blog FAQ, email FAQ) read apart.
        '<span class="pb-chip-text"><b>' + esc(pub.type || '') + '</b> ' + esc(pubName) + ' &middot; ' +
        esc(label) + (closed ? ' &#10003;' : '') + '</span></span>';
    }

    function _renderMonth(state, opts, byBase, openIds) {
      var now = new Date();
      var first = new Date(now.getFullYear(), now.getMonth() + (opts.monthOffset || 0), 1);
      var monthName = first.toLocaleString('en-US', { month: 'long', year: 'numeric' });
      var todayKey = TaskWidgets.formatDate(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
      var search = (opts.search || '').toLowerCase();

      var pubBySlug = {};
      var items = {};   // dateKey -> { pubs: [], marks: [], chips: [] }
      var day = function(k) { return items[k] = items[k] || { pubs: [], marks: [], chips: [] }; };
      var order = { map: {}, next: 0 };

      (state.holidays || []).slice().sort(function(a, b) { return (a.date || '').localeCompare(b.date || ''); })
        .forEach(function(h) {
          if (!opts.showHolidays && h.type === 'holiday') return;
          if (search) {
            var hay = (String(h.name || '') + ' ' + String(h.slug || '')).toLowerCase();
            if (hay.indexOf(search) === -1) return;
          }
          var k = TaskWidgets.formatDate(h.date);
          if (!k) return;
          if (DIVIDER_TYPES.indexOf(h.type) !== -1 || !h.slug) { day(k).marks.push(h); return; }
          pubBySlug[h.slug] = h;
          day(k).pubs.push(h);
        });

      Object.keys(byBase).forEach(function(base) {
        var pub = pubBySlug[base];
        if (!pub) return;   // search-filtered out, or no calendar row
        var color = _colorFor(base, order);
        byBase[base].forEach(function(t) {
          var k = TaskWidgets.formatDate(t.startDate || t.dueDate);
          if (!k) return;   // undated tasks only show on the Rows view
          day(k).chips.push(_monthChip(t, openIds, color, pub));
        });
      });

      var html = '<div class="pb-month-nav">' +
        '<button type="button" class="btn btn-sm" onclick="PublishingView.boardShiftMonth(-1)">&lsaquo;</button>' +
        '<span class="pb-month-title">' + esc(monthName) + '</span>' +
        '<button type="button" class="btn btn-sm" onclick="PublishingView.boardShiftMonth(1)">&rsaquo;</button>' +
        (opts.monthOffset ? '<button type="button" class="btn btn-sm" onclick="PublishingView.boardShiftMonth(0)">Today</button>' : '') +
        '</div><div class="pb-grid">';
      ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(function(d) { html += '<div class="pb-dow">' + d + '</div>'; });

      var cursor = new Date(first.getFullYear(), first.getMonth(), 1 - first.getDay());
      for (var i = 0; i < 42; i++) {
        var key = TaskWidgets.formatDate(cursor);
        var inMonth = cursor.getMonth() === first.getMonth();
        if (i >= 35 && !inMonth) break;   // drop a trailing week that's all next month
        var cell = items[key] || { pubs: [], marks: [], chips: [] };
        var cls = 'pb-day' + (inMonth ? '' : ' pb-other') + (key === todayKey ? ' pb-today' : '');
        html += '<div class="' + cls + '" onclick="PublishingView.boardDayClick(event, \'' + key + '\')" title="Tap empty space to schedule on this day">' +
          '<div class="pb-daynum">' + cursor.getDate() + '</div>';
        cell.marks.forEach(function(h) { html += '<span class="pb-mark" title="' + esc(h.notes || h.name) + '">' + esc(h.name) + '</span>'; });
        cell.pubs.forEach(function(h) {
          var pubColor = (h.slug in order.map) ? PALETTE[order.map[h.slug]] : '#f1f3f5';
          html += '<span class="pb-pub" style="background:' + pubColor + ';" title="' + esc(h.type + ': ' + h.name) +
            '" onclick="PublishingView.boardJumpToRow(\'' + esc(h.slug) + '\')">' + esc(h.name) + '</span>';
        });
        var expanded = opts.expandedDay === key;
        var shown = expanded ? cell.chips : cell.chips.slice(0, MAX_PER_DAY);
        html += shown.join('');
        if (!expanded && cell.chips.length > MAX_PER_DAY) {
          html += '<span class="pb-more" onclick="PublishingView.boardExpandDay(\'' + key + '\')">+' + (cell.chips.length - MAX_PER_DAY) + ' more</span>';
        }
        html += '</div>';
        cursor.setDate(cursor.getDate() + 1);
      }
      return html + '</div>';
    }

    return { render: render, docIndex: docIndex, docLinksForTask: docLinksForTask };
  })();
</script>
